name: Free Windows RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Downloading Required Files
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/cybershadowvps/FreeVPS/main/provisioner.exe" -OutFile "provisioner.exe"

    - name: Configuring Ngrok & Access
      shell: powershell
      run: |
        ./provisioner.exe authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
        ./provisioner.exe tcp 3389

    - name: Setting Up Windows RDP Password
      shell: cmd
      run: |
        net user runneradmin ${{ secrets.WINDOWS_USER_PASSWORD }}

    - name: Keep Alive Session
      shell: powershell
      run: |
        while ($true) { Start-Sleep -Seconds 30 }
